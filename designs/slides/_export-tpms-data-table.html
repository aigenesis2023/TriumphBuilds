<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Export — TPMS Data Table (empty)</title>
<style>
:root {
  --line: rgba(180, 180, 195, 0.75);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; overflow: hidden; }
.data-table {
  width: 1320px;
  background: transparent;
  border: 1.5px solid var(--line);
  display: flex; flex-direction: column;
}
.tr {
  display: grid; grid-template-columns: 1.5fr 1fr 1fr;
  border-bottom: 1px solid var(--line);
  height: 80px;
  background: transparent;
}
.tr:last-child { border-bottom: none; }
.tr .td {
  border-right: 1px solid var(--line);
  background: transparent;
}
.tr .td:last-child { border-right: none; }
</style>
</head>
<body>
<div class="data-table">
  <div class="tr head"><div class="td"></div><div class="td"></div><div class="td"></div></div>
  <div class="tr"><div class="td"></div><div class="td"></div><div class="td"></div></div>
  <div class="tr"><div class="td"></div><div class="td"></div><div class="td"></div></div>
  <div class="tr"><div class="td"></div><div class="td"></div><div class="td"></div></div>
  <div class="tr"><div class="td"></div><div class="td"></div><div class="td"></div></div>
  <div class="tr"><div class="td"></div><div class="td"></div><div class="td"></div></div>
  <div class="tr"><div class="td"></div><div class="td"></div><div class="td"></div></div>
  <div class="tr"><div class="td"></div><div class="td"></div><div class="td"></div></div>
</div>
</body>
</html>
